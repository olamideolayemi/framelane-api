# fly.toml app configuration file generated for framelane-api on 2026-06-09T22:29:27+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'framelane-api'
primary_region = 'jnb'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]

[env]
  CURRENCY = 'NGN'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
